[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk"
version = "0.1.0"
description = "Leakage-safe, standards-aligned AI security risk management artifact for reproducible research."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Ercan Erkalkan", email = "ercan.erkalkan@marmara.edu.tr"}
]
maintainers = [
  {name = "Ercan Erkalkan", email = "ercan.erkalkan@marmara.edu.tr"}
]
keywords = [
  "cybersecurity",
  "risk-management",
  "intrusion-detection",
  "iot",
  "iso27001",
  "nist-csf",
  "nsga-ii"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security"
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.6",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "statsmodels>=0.14",
  "xgboost>=3.0",
  "lightgbm>=4.6",
  "pulp>=3.2",
  "pymoo>=0.6",
  "torch>=2.8"
]

[project.urls]
Homepage = "https://github.com/ErcanErkalkan/AI_Enabled_Standards_Aligned_Security_Risk_Management"
Repository = "https://github.com/ErcanErkalkan/AI_Enabled_Standards_Aligned_Security_Risk_Management"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.19928296"
"Author ORCID" = "https://orcid.org/0000-0001-9259-7112"

[project.optional-dependencies]
dev = [
  "pytest>=8.3"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ai_risk*"]
