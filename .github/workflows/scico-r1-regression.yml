name: SCICO R1 canonical regression

on:
  push:
    branches:
      - main
      - scico-r1-canonical-promotion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: software/requirements.lock
      - name: Install pinned requirements
        working-directory: software
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pytest
      - name: Verify canonical R1 exact bytes
        run: sha256sum -c software/R1_CANONICAL_SHA256SUMS.txt
      - name: Full pytest suite
        working-directory: software
        run: python -m pytest -q
      - name: Canonical mapping validator
        working-directory: software
        run: python tools/validate_mappings.py
      - name: Seeded structural regression
        working-directory: software
        run: python tools/test_validator_seeded_defects.py
